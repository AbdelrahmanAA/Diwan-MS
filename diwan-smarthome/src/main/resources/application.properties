server.port=8086
spring.application.name=diwan-smarthome
spring.profiles.active=DEV

# MySQL DB - configured per profile (application-DEV.properties / application-SIT.properties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

diwan.jwt.secret=${JWT_SECRET:super-secret-key-change-me-please-32chars-min}

smarthome.alexa.lambda-secret=${ALEXA_LAMBDA_SHARED_SECRET:change-me-alexa-lambda-secret}

smarthome.mqtt.broker-url=${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
smarthome.mqtt.client-prefix=${MQTT_CLIENT_PREFIX:diwan-smarthome-}
smarthome.mqtt.username=${MQTT_USERNAME:}
smarthome.mqtt.password=${MQTT_PASSWORD:}
smarthome.mqtt.qos=${MQTT_QOS:1}
smarthome.mqtt.retain=${MQTT_RETAIN:false}
