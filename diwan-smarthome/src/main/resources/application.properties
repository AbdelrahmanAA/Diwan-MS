server.port=${SERVER_PORT:8086}
spring.application.name=diwan-smarthome
spring.profiles.active=SIT

# MySQL DB - configured per profile (application-DEV.properties / application-SIT.properties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

diwan.jwt.secret=${JWT_SECRET}

smarthome.alexa.lambda-secret=${ALEXA_LAMBDA_SHARED_SECRET}

smarthome.mqtt.broker-url=${MQTT_BROKER_URL}
smarthome.mqtt.client-prefix=${MQTT_CLIENT_PREFIX:diwan-smarthome-}
smarthome.mqtt.username=${MQTT_USERNAME:}
smarthome.mqtt.password=${MQTT_PASSWORD:}
smarthome.mqtt.qos=${MQTT_QOS:1}
smarthome.mqtt.retain=${MQTT_RETAIN:false}


# Gateway trust (diwan-common auto-configuration); Alexa authenticates itself (lambda secret + user JWT)
diwan.trust.url-patterns=/api/smart-home/*,/api/smart-home
diwan.trust.public-paths=/api/smart-home/alexa
# Keeps this service's own {"error": ...} contract
diwan.web.error-handler=false

# Every log line carries the request id (diwan-common RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]

# --- Operations -------------------------------------------------------------
# Graceful shutdown: finish in-flight requests before the container stops
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Actuator runs on its own port (not published, not routed through the gateway): health probes + Prometheus
management.server.port=${MANAGEMENT_PORT:18086}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
