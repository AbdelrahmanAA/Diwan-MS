spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diwan_smarthome?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


# Dev-only fallback; SIT/prod must supply JWT_SECRET via environment
diwan.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-outside-dev-0123456789}
smarthome.alexa.lambda-secret=${ALEXA_LAMBDA_SHARED_SECRET:dev-only-alexa-lambda-secret}
smarthome.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
