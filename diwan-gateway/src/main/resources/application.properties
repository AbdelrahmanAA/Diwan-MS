server.port=${SERVER_PORT:8111}

spring.application.name=diwan-gateway
spring.profiles.active=SIT
# Connection configured per profile: application-DEV.properties / application-SIT.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

spring.cloud.gateway.discovery.locator.enabled=false

spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

diwan.jwt.secret=${JWT_SECRET}


# Paths that require an ADMIN role claim in the JWT (no token carries one yet, so they are closed).
# GET /api/features (the dashboard cards) is the one public exception, see JwtAuthFilter.
diwan.gateway.admin-paths=/admin,/api/logs,/api/features,/actuator


# Request-log producer: bounded waits so a Kafka outage cannot stall the gateway (see RequestLogPublisher)
diwan.kafka.topics.request-logs=request-logs
spring.kafka.producer.acks=1
spring.kafka.producer.properties.max.block.ms=500
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.linger.ms=20
diwan.gateway.request-log.queue-capacity=10000

# Routing: routes come from the service_routes table; every instance reloads when it changes
diwan.gateway.routes.refresh-interval-ms=30000
# Resilience (per route: timeout = service_routes.timeout_ms; GET-only retries; circuit breaker with fallback)
diwan.gateway.resilience.retries=2
diwan.gateway.resilience.connect-timeout-ms=2000
diwan.gateway.resilience.default-response-timeout-ms=10000
# Rate limiting (Redis token bucket): per user, plus a strict per-IP limit on login/register
diwan.gateway.rate-limit.enabled=true
diwan.gateway.rate-limit.user.replenish-rate=20
diwan.gateway.rate-limit.user.burst-capacity=40
diwan.gateway.rate-limit.user.requested-tokens=1
diwan.gateway.rate-limit.auth.replenish-rate=1
diwan.gateway.rate-limit.auth.burst-capacity=60
diwan.gateway.rate-limit.auth.requested-tokens=12
diwan.gateway.rate-limit.auth-paths=/api/users/login,/api/users/register
# Number of reverse proxies (nginx) in front of the gateway, for the real client IP
diwan.gateway.trusted-proxies=1

# --- Operations -------------------------------------------------------------
# Graceful shutdown: finish in-flight requests before the container stops
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Actuator runs on its own port (not published, not routed through the gateway): health probes + Prometheus
management.server.port=${MANAGEMENT_PORT:18111}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
