server.port=8087

spring.application.name=diwan-gateway
spring.profiles.active=DEV
# Connection configured per profile: application-DEV.properties / application-SIT.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

spring.cloud.gateway.discovery.locator.enabled=false

spring.cache.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.host=${REDIS_HOST:localhost}
spring.kafka.producer.port=${REDIS_PORT:6379}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.secret=${JWT_SECRET:CHANGE_ME_USE_ENV_SECRET_AT_LEAST_32_CHARS_LONG}

diwan.jwt.secret=diwanSuperSecretKey2024VeryLongKeyForHMAC512Algorithm

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
