server:
  port: 8087

spring:
  application:
    name: diwan-gateway
  profiles:
    active: ٍSIT
  datasource:
    # Connection configured per profile: application-DEV.yml / application-SIT.yml
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
  cache:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  data:
    redis:
      host: localhost
      port: 6379
    secret: ${JWT_SECRET:CHANGE_ME_USE_ENV_SECRET_AT_LEAST_32_CHARS_LONG}

diwan:
  jwt:
    secret: diwanSuperSecretKey2024VeryLongKeyForHMAC512Algorithm

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true