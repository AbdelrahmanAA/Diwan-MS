server.port=8085
spring.application.name=diwan-transactions

# MySQL DB
spring.datasource.url=jdbc:mysql://localhost:3306/diwan_transactions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=diwanSuperSecretKey2024VeryLongKeyForHMAC512Algorithm
app.jwt.expiration=604800000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transactions-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.voicetransactions.kafka.UserInvalidatedEvent

# Users MS
diwan.users.service.url=http://localhost:8083