server.port=${SERVER_PORT:8083}
spring.application.name=diwan-users
spring.profiles.active=SIT

# MySQL DB - configured per profile (application-DEV.properties / application-SIT.properties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Outbox relay (see com.diwan.users.outbox)
diwan.kafka.topics.user-invalidated=user.invalidated
diwan.outbox.poll-interval-ms=2000
diwan.outbox.retention-days=7

# JWT
diwan.jwt.secret=${JWT_SECRET}
diwan.jwt.expiration=${JWT_EXPIRATION_MS:604800000}


# Gateway trust (diwan-common auto-configuration)
diwan.trust.url-patterns=/api/users/*,/internal/*
diwan.trust.public-paths=/api/users/login,/api/users/register

# Every log line carries the request id (diwan-common RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]

# --- Operations -------------------------------------------------------------
# Graceful shutdown: finish in-flight requests before the container stops
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Actuator runs on its own port (not published, not routed through the gateway): health probes + Prometheus
management.server.port=${MANAGEMENT_PORT:18083}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
