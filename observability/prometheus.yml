# Scrapes the management port (8081) of every service; it is only reachable inside the docker network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: diwan
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['diwan-gateway:8081']
        labels: {service: diwan-gateway}
      - targets: ['diwan-users:8081']
        labels: {service: diwan-users}
      - targets: ['diwan-transactions:8081']
        labels: {service: diwan-transactions}
      - targets: ['diwan-medical:8081']
        labels: {service: diwan-medical}
      - targets: ['diwan-smarthome:8081']
        labels: {service: diwan-smarthome}
      - targets: ['diwan-logging:8081']
        labels: {service: diwan-logging}
