# -- Server ------------------------------------------------------------------
server.port=8080

# -- H2 File-Based Database (data persists across restarts) ------------------
spring.datasource.url=jdbc:h2:file:D:/SpringBoot/data/voicedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console - JDBC URL matches datasource so console auto-fills correctly
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -- Jackson (JSON) ----------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false