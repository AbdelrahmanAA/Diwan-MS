# --- Alerts ({0} = subject, {1} = observed value, {2} = threshold) ---------------------
alert.PRICE_ABOVE.title={0} is above your target
alert.PRICE_ABOVE.message={0} is trading at {1}, at or above your alert price of {2}.
alert.PRICE_BELOW.title={0} fell below your alert price
alert.PRICE_BELOW.message={0} is trading at {1}, at or below your alert price of {2}.
alert.DAILY_MOVE_PERCENT.title={0} moved sharply today
alert.DAILY_MOVE_PERCENT.message={0} moved {1}% since the previous close (your limit: {2}%).
alert.GAIN_PERCENT.title=Take-profit level reached for {0}
alert.GAIN_PERCENT.message={0} is up {1}% on your average cost (target: {2}%).
alert.LOSS_PERCENT.title=Stop-loss level reached for {0}
alert.LOSS_PERCENT.message={0} is at {1}% against your average cost (limit: -{2}%).
alert.ALLOCATION_DRIFT.title={0} drifted from its target allocation
alert.ALLOCATION_DRIFT.message=Part of {0} is {1} points away from its target (limit: {2}). Consider rebalancing.
