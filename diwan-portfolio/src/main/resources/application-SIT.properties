# TLS to MySQL: PREFERRED encrypts whenever the server offers TLS (MySQL 8 does by default);
# DB_SSL_MODE=REQUIRED makes it mandatory (see scripts/mysql-encryption.sh)
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/diwan_portfolio?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.kafka.bootstrap-servers=iot-kafka:9092
