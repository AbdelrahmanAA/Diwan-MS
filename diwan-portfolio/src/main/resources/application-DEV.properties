# =====================================================================
# DEV Profile - Local development (localhost)
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diwan_portfolio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Dev-only fallbacks; SIT/prod must supply JWT_SECRET and DATA_ENCRYPTION_KEYS via environment
diwan.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-outside-dev-0123456789}
diwan.crypto.keys=${DATA_ENCRYPTION_KEYS:dev:ZGV2LW9ubHktZGF0YS1rZXktZG8tbm90LXVzZSEhISE=}

# No real network calls for exchange rates unless asked for
diwan.portfolio.fx.provider=${FX_PROVIDER:fake}
