server.port=${SERVER_PORT:8088}
spring.application.name=diwan-portfolio
spring.profiles.active=SIT

# MySQL DB - configured per profile (application-DEV.properties / application-SIT.properties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# New service: never baseline. A non-empty schema without Flyway history (e.g. tables of an old prototype)
# must stop startup instead of silently skipping V1.
spring.flyway.baseline-on-migrate=false

# Arabic / English: messages*.properties, picked by the Accept-Language header (default English)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=en

# Kafka: consumes user.invalidated (deletes the user's data); undeserializable / failing records go to <topic>.DLT
diwan.kafka.topics.user-invalidated=user.invalidated
diwan.kafka.topics.portfolio-alerts=portfolio.alerts
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=portfolio-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.diwan.common.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.diwan.common.event.UserInvalidatedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Alert publishing must never hold a job thread for long when Kafka is down
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000

# Shared secret (gateway signs identity headers with a key derived from it); no default outside DEV
diwan.jwt.secret=${JWT_SECRET}
# Column encryption key(s) "id:base64(32 bytes)[,older...]" - no default outside DEV. Losing it loses the data.
diwan.crypto.keys=${DATA_ENCRYPTION_KEYS}

# Gateway trust (diwan-common auto-configuration)
diwan.trust.url-patterns=/api/portfolio/*,/api/portfolio

# --- Market data ------------------------------------------------------------
# auto = Finnhub when FINNHUB_API_KEY is set, otherwise the built-in fake provider (deterministic prices)
diwan.portfolio.market-data.provider=${MARKET_DATA_PROVIDER:auto}
diwan.portfolio.market-data.finnhub.api-key=${FINNHUB_API_KEY:}
diwan.portfolio.market-data.finnhub.base-url=https://finnhub.io/api/v1
# Free tier allows 60 calls/minute; stay below it
diwan.portfolio.market-data.finnhub.calls-per-minute=50
# Saudi symbols (*.SR) go to SAHMK when SAHMK_API_KEY is set. The free plan is 100 requests/day for the whole
# account: stop a little below it and keep some for users adding symbols. Refresh window is Riyadh time, Sun-Thu,
# and ends after the market closes because the data is about 15 minutes delayed.
diwan.portfolio.market-data.sahmk.api-key=${SAHMK_API_KEY:}
diwan.portfolio.market-data.sahmk.base-url=https://api.sahmk.sa/api/v1
diwan.portfolio.market-data.sahmk.daily-requests=95
diwan.portfolio.market-data.sahmk.reserved-requests=10
diwan.portfolio.market-data.sahmk.calls-per-minute=9
diwan.portfolio.market-data.sahmk.refresh-from=10:15
diwan.portfolio.market-data.sahmk.refresh-until=16:00
diwan.portfolio.market-data.sahmk.min-refresh-minutes=15
# Gold symbols (GOLD-24K, -22K, -21K, -18K, USD per gram) from gold-api.com (free, no key); "fake" = demo prices
diwan.portfolio.gold.provider=${GOLD_PROVIDER:gold-api}
diwan.portfolio.gold.base-url=https://api.gold-api.com
# Exchange rates: open.er-api.com (free, no key, daily updates); "fake" uses fixed rates
diwan.portfolio.fx.provider=${FX_PROVIDER:open-er-api}
diwan.portfolio.fx.base-url=https://open.er-api.com/v6
# Job schedules (cron, server time = UTC in the containers)
diwan.portfolio.jobs.enabled=${PORTFOLIO_JOBS_ENABLED:true}
diwan.portfolio.jobs.quotes-cron=${QUOTES_CRON:0 */5 * * * *}
diwan.portfolio.jobs.daily-close-cron=${DAILY_CLOSE_CRON:0 30 22 * * *}
diwan.portfolio.jobs.fx-cron=${FX_CRON:0 15 */6 * * *}
diwan.portfolio.jobs.news-cron=${NEWS_CRON:0 10 * * * *}
diwan.portfolio.jobs.drift-cron=${DRIFT_CRON:0 45 22 * * *}
diwan.portfolio.jobs.cleanup-cron=0 0 3 * * *
diwan.portfolio.news.lookback-days=3
diwan.portfolio.news.retention-days=90
diwan.portfolio.alerts.cooldown-hours=24

# Every log line carries the request id (diwan-common RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]

# --- Operations -------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.server.port=${MANAGEMENT_PORT:18088}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

# BigDecimal in JSON as 100.5, never 1.005E+2
spring.jackson.generator.write-bigdecimal-as-plain=true
