services:

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────

  mysql:
    image: mysql:8.4
    container_name: diwan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DEFAULT_DB:-diwan_users}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: diwan-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: diwan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - diwan-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: diwan-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # MICROSERVICES  (only the gateway publishes a port; the rest are reachable on diwan-net only)
  # ─────────────────────────────────────────────

  diwan-users:
    build:
      context: .
      dockerfile: diwan-users/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: diwan/diwan-users:${IMAGE_TAG:-latest}
    container_name: diwan-users
    mem_limit: ${SERVICE_MEMORY:-384m}
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      DB_URL: jdbc:mysql://diwan-mysql:3306/diwan_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: diwan-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  diwan-transactions:
    build:
      context: .
      dockerfile: diwan-transactions/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: diwan/diwan-transactions:${IMAGE_TAG:-latest}
    container_name: diwan-transactions
    mem_limit: ${SERVICE_MEMORY:-384m}
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      DB_URL: jdbc:mysql://diwan-mysql:3306/diwan_transactions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: diwan-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      USERS_SERVICE_URL: http://diwan-users:8080
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      diwan-users:
        condition: service_healthy
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  diwan-medical:
    build:
      context: .
      dockerfile: diwan-medical/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: diwan/diwan-medical:${IMAGE_TAG:-latest}
    container_name: diwan-medical
    mem_limit: ${SERVICE_MEMORY:-384m}
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      DB_URL: jdbc:mysql://diwan-mysql:3306/diwan_medical?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: diwan-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      USERS_SERVICE_URL: http://diwan-users:8080
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      diwan-users:
        condition: service_healthy
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  diwan-logging:
    build:
      context: .
      dockerfile: diwan-logging/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: diwan/diwan-logging:${IMAGE_TAG:-latest}
    container_name: diwan-logging
    mem_limit: ${SERVICE_MEMORY:-384m}
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      DB_URL: jdbc:mysql://diwan-mysql:3306/diwan_logging?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  diwan-smarthome:
    build:
      context: .
      dockerfile: diwan-smarthome/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: diwan/diwan-smarthome:${IMAGE_TAG:-latest}
    container_name: diwan-smarthome
    mem_limit: ${SERVICE_MEMORY:-384m}
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      DB_URL: jdbc:mysql://diwan-mysql:3306/diwan_smarthome?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: diwan-redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      ALEXA_LAMBDA_SHARED_SECRET: ${ALEXA_LAMBDA_SHARED_SECRET:?Set ALEXA_LAMBDA_SHARED_SECRET in .env}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:?Set MQTT_BROKER_URL in .env}
      MQTT_CLIENT_PREFIX: ${MQTT_CLIENT_PREFIX:-diwan-smarthome-}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  diwan-gateway:
    build:
      context: .
      dockerfile: diwan-gateway/Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: diwan/diwan-gateway:${IMAGE_TAG:-latest}
    container_name: diwan-gateway
    mem_limit: ${GATEWAY_MEMORY:-512m}
    stop_grace_period: 30s
    ports:
      - "8087:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      DB_URL: jdbc:mysql://diwan-mysql:3306/diwan_gateway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      USERS_SERVICE_URL: http://diwan-users:8080
      TRANSACTIONS_SERVICE_URL: http://diwan-transactions:8080
      MEDICAL_SERVICE_URL: http://diwan-medical:8080
      LOGGING_SERVICE_URL: http://diwan-logging:8080
      SMARTHOME_SERVICE_URL: http://diwan-smarthome:8080
      REDIS_HOST: diwan-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      diwan-users:
        condition: service_healthy
      diwan-transactions:
        condition: service_healthy
      diwan-medical:
        condition: service_healthy
      diwan-logging:
        condition: service_healthy
      diwan-smarthome:
        condition: service_healthy
    networks:
      - diwan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # OBSERVABILITY (optional): docker compose --profile observability up -d
  # Prometheus scrapes each service's management port (8081, not published). Grafana: http://localhost:3000
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: diwan-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - diwan-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: diwan-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - diwan-net
    restart: unless-stopped

networks:
  diwan-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
